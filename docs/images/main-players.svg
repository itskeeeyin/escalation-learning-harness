<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 596" width="1200" height="596" role="img" aria-labelledby="title description">
<title id="title">Who owns each decision</title><desc id="description">The demo uses one reviewer to play the escalation manager, team owners, and executive sponsor.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#5a6680"/></marker></defs>
<style>
text{font-family:Inter,Arial,sans-serif}.title{font-size:36px;font-weight:700;fill:#1b2333}.subtitle{font-size:18px;fill:#46526b}.label{font-size:13px;font-weight:700;letter-spacing:1.4px;fill:#56647e}.cardTitle{font-size:18px;font-weight:700}.body{font-size:15px;fill:#46526b}
</style>
<rect width="1200" height="596" fill="#f6f7fb"/>
<text x="40" y="60" class="title">Who owns each decision</text><text x="40" y="91" class="subtitle">The demo uses one reviewer to play the escalation manager, team owners, and executive sponsor.</text><rect x="40" y="139" width="357" height="112" rx="16" fill="#e7f5ff" stroke="#339af0" stroke-width="2"/><g fill="#1864ab"><text x="58" y="170" class="cardTitle">Customer</text></g><text x="58" y="196" class="body">Reports impact and confirms whether</text><text x="58" y="218" class="body">the rebuilt workflow supports the rollout.</text><rect x="421" y="139" width="357" height="112" rx="16" fill="#fff9db" stroke="#f0a000" stroke-width="2"/><g fill="#876000"><text x="439" y="170" class="cardTitle">Escalation manager</text></g><text x="439" y="196" class="body">Owns the case and customer update.</text><text x="439" y="218" class="body">Signs off on recovery, the plan, and closure.</text><rect x="802" y="139" width="358" height="112" rx="16" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/><g fill="#5834be"><text x="820" y="170" class="cardTitle">Workflow agents</text></g><text x="820" y="196" class="body">Read case evidence and propose findings,</text><text x="820" y="218" class="body">communications, and owner assignments.</text><text x="40" y="290" class="label">TEAMS THAT OWN FOLLOW-UP</text><rect x="40" y="307" width="357" height="100" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><g fill="#1b7837"><text x="58" y="338" class="cardTitle">Engineering and Product &amp; Design</text></g><text x="58" y="364" class="body">Test discard safeguards and verify that</text><text x="58" y="386" class="body">customers understand the warning.</text><rect x="421" y="307" width="357" height="100" rx="16" fill="#e8faf7" stroke="#129488" stroke-width="2"/><g fill="#0c6e66"><text x="439" y="338" class="cardTitle">Support and Customer Success</text></g><text x="439" y="364" class="body">Improve triage guidance and verify</text><text x="439" y="386" class="body">the next rollout with the customer.</text><rect x="802" y="307" width="358" height="100" rx="16" fill="#e7f5ff" stroke="#339af0" stroke-width="2"/><g fill="#1864ab"><text x="820" y="338" class="cardTitle">Documentation &amp; Enablement</text></g><text x="820" y="364" class="body">Publish safe editing and rebuild guidance.</text><rect x="40" y="429" width="357" height="112" rx="16" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/><g fill="#5834be"><text x="58" y="460" class="cardTitle">Operations &amp; Analytics</text></g><text x="58" y="486" class="body">Measure confirmed repeat escalations</text><text x="58" y="508" class="body">relative to draft-edit activity.</text><rect x="421" y="429" width="357" height="112" rx="16" fill="#fff4e0" stroke="#e67700" stroke-width="2"/><g fill="#a84e00"><text x="439" y="460" class="cardTitle">Executive leadership</text></g><text x="439" y="486" class="body">Reviews residual risk after team sign-off</text><text x="439" y="508" class="body">and sets the next review.</text><rect x="802" y="429" width="358" height="112" rx="16" fill="#fff9db" stroke="#f0a000" stroke-width="2"/><g fill="#876000"><text x="820" y="460" class="cardTitle">Verification rule</text></g><text x="820" y="486" class="body">Each action requires acceptance criteria,</text><text x="820" y="508" class="body">completion evidence, and reviewer sign-off.</text>
</svg>
