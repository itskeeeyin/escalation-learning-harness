<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-labelledby="title description">
<title id="title">How influence is measured</title>
<desc id="description">A lesson is created, routed, accepted in the owner team's own system, implemented, verified, and held. Six owner teams are shown. A repeat reopens the lesson. The diagram is an example.</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#5a6680"/></marker>
<marker id="back" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a61e4d"/></marker>
</defs>
<style>
text{font-family:Inter,Arial,sans-serif}.title{font-size:34px;font-weight:700;fill:#1b2333}.subtitle{font-size:16px;fill:#46526b}.label{font-size:13px;font-weight:700;letter-spacing:1.4px;fill:#56647e}.cardTitle{font-size:18px;font-weight:700}.teamTitle{font-size:15px;font-weight:700}.longTitle{font-size:14px;font-weight:700}.body{font-size:15px;fill:#46526b}.small{font-size:14px;fill:#46526b}
</style>
<rect width="1200" height="820" fill="#f6f7fb"/>
<text x="40" y="52" class="title">How influence is measured</text>
<text x="40" y="82" class="subtitle">A lesson is accepted in the owner team's own system, then checked to see if it held. Example only.</text>
<text x="32" y="122" class="label">ESCALATIONS</text>
<text x="244" y="122" class="label">LIFECYCLE</text>
<text x="474" y="122" class="label">WHERE IT GOES</text>
<text x="842" y="122" class="label">SCORECARD</text>
<rect x="32" y="136" width="196" height="456" rx="16" fill="#eef1f6" stroke="#8aa0b8" stroke-width="2"/>
<g fill="#3d4d66"><text x="50" y="170" class="cardTitle">Escalations</text></g>
<text x="50" y="204" class="body">The case is triaged.</text>
<text x="50" y="228" class="body">A person approves</text>
<text x="50" y="252" class="body">the priority and</text>
<text x="50" y="276" class="body">the customer update.</text>
<rect x="244" y="136" width="214" height="456" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<g fill="#1b7837"><text x="262" y="170" class="cardTitle">Lessons bank</text></g>
<text x="262" y="204" class="body">Created from the case.</text>
<text x="262" y="228" class="body">Routed to one owner.</text>
<text x="262" y="252" class="body">Accepted, with a</text>
<text x="262" y="276" class="body">link back.</text>
<text x="262" y="300" class="body">Implemented, then</text>
<text x="262" y="324" class="body">verified.</text>
<text x="262" y="348" class="body">Held, or a repeat</text>
<text x="262" y="372" class="body">reopens it.</text>
<rect x="474" y="136" width="348" height="68" rx="14" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/>
<g fill="#5834be"><text x="490" y="164" class="teamTitle">Support</text></g>
<text x="490" y="186" class="body">Training, plus a runbook to rehearse.</text>
<rect x="474" y="212" width="348" height="68" rx="14" fill="#edf2ff" stroke="#4c6ef5" stroke-width="2"/>
<g fill="#364fc7"><text x="490" y="240" class="teamTitle">Solutions Architects</text></g>
<text x="490" y="262" class="body">A solution pattern for the next design.</text>
<rect x="474" y="288" width="348" height="68" rx="14" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/>
<g fill="#343a40"><text x="490" y="316" class="longTitle">Data center / hardware operations</text></g>
<text x="490" y="338" class="body">A hardware check before customers see it.</text>
<rect x="474" y="364" width="348" height="68" rx="14" fill="#e8faf7" stroke="#129488" stroke-width="2"/>
<g fill="#0c6e66"><text x="490" y="392" class="teamTitle">Product management</text></g>
<text x="490" y="414" class="body">Clearer warning, screen, or guide.</text>
<rect x="474" y="440" width="348" height="68" rx="14" fill="#fff9db" stroke="#f0a000" stroke-width="2"/>
<g fill="#876000"><text x="490" y="468" class="longTitle">Field / professional services engineers</text></g>
<text x="490" y="490" class="body">A tool or check that avoids an escalation.</text>
<rect x="474" y="516" width="348" height="76" rx="14" fill="#e7f5ff" stroke="#339af0" stroke-width="2"/>
<g fill="#1864ab"><text x="490" y="546" class="teamTitle">Engineering</text></g>
<text x="490" y="570" class="body">Fix the defect, or change the part.</text>
<rect x="842" y="136" width="326" height="456" rx="16" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/>
<g fill="#1b7837"><text x="860" y="170" class="cardTitle">How you are measured</text></g>
<text x="860" y="204" class="body">Influence: what got finished.</text>
<text x="860" y="228" class="body">Outcome: did it come back?</text>
<text x="860" y="252" class="body">AI loop: cited, with a person</text>
<text x="860" y="276" class="body">on every action.</text>
<text x="860" y="312" class="body">By team: acceptance, time to</text>
<text x="860" y="336" class="body">accept, time to implement,</text>
<text x="860" y="360" class="body">verified, and repeats.</text>
<text x="860" y="396" class="body">Baseline, change, how measured,</text>
<text x="860" y="420" class="body">and whether it held.</text>
<text x="860" y="456" class="body">Figures in the demo are</text>
<text x="860" y="480" class="body">an example, not a track record.</text>
<path d="M228 364H244" fill="none" stroke="#5a6680" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M458 364H474" fill="none" stroke="#5a6680" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M822 364H842" fill="none" stroke="#5a6680" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M1040 620H188" fill="none" stroke="#a61e4d" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#back)"/>
<text x="600" y="648" text-anchor="middle" class="small" fill="#a61e4d">A repeat of a closed lesson reopens it. The target for those repeats is zero.</text>
<rect x="32" y="668" width="1136" height="116" rx="16" fill="#fff4e0" stroke="#e67700" stroke-width="2"/>
<g fill="#a84e00"><text x="50" y="700" class="cardTitle">Baseline, in the first 30–60 days</text></g>
<text x="50" y="728" class="body">Read the last 2–4 quarters from the tools already in use. Talk with support, the account team, engineering, and a few customers.</text>
<text x="50" y="752" class="body">If the tags disagree, define them, tag from day one, and use the first full quarter as the baseline. No new system of record.</text>
</svg>
