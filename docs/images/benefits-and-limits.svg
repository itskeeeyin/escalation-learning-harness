<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 543" width="1200" height="543" role="img" aria-labelledby="title description">
<title id="title">Benefits and current limits</title><desc id="description">The replay tests workflow rules. A production pilot would measure the business outcomes.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#5a6680"/></marker></defs>
<style>
text{font-family:Inter,Arial,sans-serif}.title{font-size:36px;font-weight:700;fill:#1b2333}.subtitle{font-size:18px;fill:#46526b}.label{font-size:13px;font-weight:700;letter-spacing:1.4px;fill:#56647e}.cardTitle{font-size:18px;font-weight:700}.body{font-size:15px;fill:#46526b}
</style>
<rect width="1200" height="543" fill="#f6f7fb"/>
<text x="40" y="60" class="title">Benefits and current limits</text><text x="40" y="91" class="subtitle">The replay tests workflow rules. A production pilot would measure the business outcomes.</text><text x="40" y="137" class="label">EXPECTED BENEFITS</text><text x="618" y="137" class="label">CURRENT DESIGN LIMITS</text><rect x="40" y="151" width="542" height="112" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><g fill="#1b7837"><text x="58" y="182" class="cardTitle">Accountability after recovery</text></g><text x="58" y="208" class="body">Separate recovery and learning closure. Give each action</text><text x="58" y="230" class="body">an owner, a due date, and an acceptance criterion.</text><rect x="618" y="151" width="542" height="112" rx="16" fill="#fff4e0" stroke="#e67700" stroke-width="2"/><g fill="#a84e00"><text x="636" y="182" class="cardTitle">One scripted case</text></g><text x="636" y="208" class="body">The specialists use deterministic rules and synthetic evidence.</text><text x="636" y="230" class="body">Case coverage and output quality remain unmeasured in production.</text><rect x="40" y="280" width="542" height="112" rx="16" fill="#e8faf7" stroke="#129488" stroke-width="2"/><g fill="#0c6e66"><text x="58" y="311" class="cardTitle">Evidence behind decisions</text></g><text x="58" y="337" class="body">Link the customer draft, root cause, and recurrence findings</text><text x="58" y="359" class="body">to source records the reviewer can inspect.</text><rect x="618" y="280" width="542" height="112" rx="16" fill="#fff9db" stroke="#f0a000" stroke-width="2"/><g fill="#876000"><text x="636" y="311" class="cardTitle">Single local reviewer</text></g><text x="636" y="337" class="body">The browser role-plays team sign-off. State lives in memory,</text><text x="636" y="359" class="body">with a downloadable decision trace.</text><rect x="40" y="409" width="542" height="102" rx="16" fill="#e7f5ff" stroke="#339af0" stroke-width="2"/><g fill="#1864ab"><text x="58" y="440" class="cardTitle">Learning across teams</text></g><text x="58" y="466" class="body">Turn a recurring product problem into changes for Product,</text><text x="58" y="488" class="body">Engineering, customer-facing teams, and leadership.</text><rect x="618" y="409" width="542" height="102" rx="16" fill="#fff0f0" stroke="#e03131" stroke-width="2"/><g fill="#b02020"><text x="636" y="440" class="cardTitle">Simulated results</text></g><text x="636" y="466" class="body">Completion proofs and recurrence figures are fixtures.</text><text x="636" y="488" class="body">Live integrations and scheduled reviews are future work.</text>
</svg>
