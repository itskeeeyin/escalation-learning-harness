<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 606" width="1200" height="606" role="img" aria-labelledby="title description">
<title id="title">Escalation learning loop</title><desc id="description">A proposed company-wide process, illustrated by one fictional practice case.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#5a6680"/></marker></defs>
<style>
text{font-family:Inter,Arial,sans-serif}.title{font-size:36px;font-weight:700;fill:#1b2333}.subtitle{font-size:18px;fill:#46526b}.label{font-size:13px;font-weight:700;letter-spacing:1.4px;fill:#56647e}.cardTitle{font-size:18px;font-weight:700}.body{font-size:15px;fill:#46526b}
</style>
<rect width="1200" height="606" fill="#f6f7fb"/>
<text x="40" y="60" class="title">Escalation learning loop</text><text x="40" y="91" class="subtitle">A proposed company-wide process, illustrated by one fictional practice case.</text><text x="40" y="139" class="label">INPUTS</text><text x="344" y="139" class="label">WORKFLOW AND HUMAN DECISIONS</text><text x="872" y="139" class="label">OUTPUTS</text><rect x="40" y="153" width="264" height="319" rx="16" fill="#e7f5ff" stroke="#339af0" stroke-width="2"/><g fill="#1864ab"><text x="58" y="184" class="cardTitle">Case evidence</text></g><text x="58" y="210" class="body">Customer report and impact</text><text x="58" y="232" class="body">Event records and guidance</text><text x="58" y="254" class="body">Recovery validation</text><text x="58" y="276" class="body">Customer acceptance</text><text x="58" y="298" class="body">Prior confirmed cases</text><text x="58" y="320" class="body">Team completion evidence</text><rect x="344" y="153" width="488" height="94" rx="16" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/><g fill="#5834be"><text x="362" y="184" class="cardTitle">1. Engage and coordinate</text></g><text x="362" y="210" class="body">Triage the case, propose a priority, and draft updates.</text><text x="362" y="232" class="body">The escalation manager approves the customer draft.</text><rect x="344" y="266" width="488" height="94" rx="16" fill="#fff9db" stroke="#f0a000" stroke-width="2"/><g fill="#876000"><text x="362" y="297" class="cardTitle">2. Confirm recovery and review the cause</text></g><text x="362" y="323" class="body">Use validation and customer acceptance. Compare earlier</text><text x="362" y="345" class="body">cases using the same mechanism and product surface.</text><rect x="344" y="379" width="488" height="93" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><g fill="#1b7837"><text x="362" y="410" class="cardTitle">3. Assign and verify follow-up</text></g><text x="362" y="436" class="body">Approve named owners and acceptance criteria.</text><text x="362" y="458" class="body">Verify each action before closing the learning record.</text><rect x="872" y="153" width="288" height="319" rx="16" fill="#e8faf7" stroke="#129488" stroke-width="2"/><g fill="#0c6e66"><text x="890" y="184" class="cardTitle">Decision records</text></g><text x="890" y="210" class="body">Approved customer preview</text><text x="890" y="232" class="body">Executive update draft</text><text x="890" y="254" class="body">Root cause and contributing factor</text><text x="890" y="276" class="body">Corrective and preventive actions</text><text x="890" y="298" class="body">Verification and decision history</text><text x="890" y="320" class="body">Recurrence review commitment</text><path d="M305 200L340 200" fill="none" stroke="#5a6680" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M833 425L868 425" fill="none" stroke="#5a6680" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M588 247L588 264" fill="none" stroke="#5a6680" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M588 360L588 377" fill="none" stroke="#5a6680" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="40" y="497" width="1120" height="75" rx="16" fill="#fff4e0" stroke="#e67700" stroke-width="2"/><g fill="#a84e00"><text x="58" y="528" class="cardTitle">Proposed production feedback loop</text></g><text x="58" y="554" class="body">A recurrence review can reopen follow-up work and feed product planning. The demo records the review commitment.</text>
</svg>
