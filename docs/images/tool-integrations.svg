<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="title description">
<title id="title">Support tool replay</title>
<desc id="description">Sample payloads move into the learning harness. Writes stay proposed until a person approves a dry-run.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#5a6680"/></marker></defs>
<style>
text{font-family:Inter,Arial,sans-serif}.title{font-size:36px;font-weight:700;fill:#1b2333}.subtitle{font-size:18px;fill:#46526b}.label{font-size:13px;font-weight:700;letter-spacing:1.4px;fill:#56647e}.cardTitle{font-size:18px;font-weight:700}.body{font-size:15px;fill:#46526b}
</style>
<rect width="1200" height="420" fill="#f6f7fb"/>
<text x="40" y="56" class="title">Support tool replay</text>
<text x="40" y="88" class="subtitle">Labeled samples only. Nothing in this diagram is connected to a company tenant.</text>
<text x="40" y="132" class="label">SIGNALS IN</text>
<text x="430" y="132" class="label">HARNESS</text>
<text x="820" y="132" class="label">PROPOSED WRITES</text>
<rect x="40" y="148" width="340" height="210" rx="16" fill="#e7f5ff" stroke="#339af0" stroke-width="2"/>
<g fill="#1864ab"><text x="58" y="180" class="cardTitle">Read the escalation</text></g>
<text x="58" y="210" class="body">PagerDuty incident and timeline</text>
<text x="58" y="234" class="body">Slack incident-channel thread</text>
<text x="58" y="258" class="body">ServiceNow incident and problem</text>
<text x="58" y="282" class="body">Salesforce Case</text>
<text x="58" y="306" class="body">Pylon issue and account</text>
<rect x="430" y="148" width="340" height="210" rx="16" fill="#fff9db" stroke="#f0a000" stroke-width="2"/>
<g fill="#876000"><text x="448" y="180" class="cardTitle">Map, then decide</text></g>
<text x="448" y="214" class="body">Adapters share one signal shape.</text>
<text x="448" y="238" class="body">The existing lesson catalog still</text>
<text x="448" y="262" class="body">proposes owners and criteria.</text>
<text x="448" y="294" class="body">A reviewer approves before any write.</text>
<rect x="820" y="148" width="340" height="210" rx="16" fill="#e8faf7" stroke="#129488" stroke-width="2"/>
<g fill="#0c6e66"><text x="838" y="180" class="cardTitle">Dry-run by default</text></g>
<text x="838" y="214" class="body">Jira action-item create</text>
<text x="838" y="238" class="body">Slack thread reply</text>
<text x="838" y="262" class="body">ServiceNow internal work note</text>
<text x="838" y="294" class="body">Approval records the request locally.</text>
<path d="M381 250L426 250" fill="none" stroke="#5a6680" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M771 250L816 250" fill="none" stroke="#5a6680" stroke-width="2.4" marker-end="url(#arrow)"/>
</svg>
