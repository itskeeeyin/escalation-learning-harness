name: Escalation replay
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python assessment_check.py --copilot-path .
      - run: python -m unittest -v
      - run: |
          python scripts/make_charts.py --out "$RUNNER_TEMP/lesson-velocity-charts"
          grep -q "EXAMPLE DATA" "$RUNNER_TEMP/lesson-velocity-charts"/*.svg
      - run: |
          python workflow_eval.py --report "$RUNNER_TEMP/workflow-scorecard.json"
          python build_demo.py
          node test_hosted.mjs "$RUNNER_TEMP/workflow-scorecard.json"
